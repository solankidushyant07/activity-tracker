name: Activity Tracker Android Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Prepare CI report directory
        shell: bash
        run: |
          rm -rf ci-reports
          mkdir -p ci-reports

      # Each verification stage is allowed to finish and write its diagnostics.
      # The final status is collected and applied only after the report artifact
      # has been uploaded.
      - name: Unit tests
        id: unit_tests
        shell: bash
        continue-on-error: true
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace 2>&1 | tee ci-reports/unit-tests.log
          status=${PIPESTATUS[0]}
          echo "$status" > ci-reports/unit-tests.exitcode
          exit 0

      - name: Android lint
        id: lint
        shell: bash
        continue-on-error: true
        run: |
          set +e
          gradle lintDebug --stacktrace 2>&1 | tee ci-reports/lint.log
          status=${PIPESTATUS[0]}
          echo "$status" > ci-reports/lint.exitcode
          exit 0

      - name: Build debug APK
        id: assemble
        shell: bash
        continue-on-error: true
        run: |
          set +e
          gradle assembleDebug --stacktrace 2>&1 | tee ci-reports/assemble.log
          status=${PIPESTATUS[0]}
          echo "$status" > ci-reports/assemble.exitcode
          exit 0

      - name: Collect Gradle diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "Activity Tracker CI diagnostic report"
            echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
            echo "=== Environment ==="
            java -version 2>&1
            gradle --version 2>&1
            echo
            echo "=== Exit codes ==="
            for f in ci-reports/*.exitcode; do
              [ -f "$f" ] && printf '%s: ' "$f" && cat "$f"
            done
            echo
            echo "=== Project files ==="
            find app/src -type f | sort
          } > ci-reports/REPORT.md

          # Preserve the complete Gradle output directories when they exist.
          cp -R app/build/reports ci-reports/app-build-reports 2>/dev/null || true
          cp -R app/build/test-results ci-reports/app-test-results 2>/dev/null || true
          cp -R app/build/outputs/logs ci-reports/app-output-logs 2>/dev/null || true

          # Create a real ZIP in addition to the GitHub artifact.
          # This is useful if someone wants to pass one report file around.
          cd ci-reports
          zip -r ../activity-tracker-build-reports.zip . >/dev/null 2>&1 || true
          cd ..

      - name: Upload APK
        if: always() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v7
        with:
          name: activity-tracker-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # IMPORTANT: this step must stay after all build/test/lint commands.
      # It runs even when the build fails and uploads the diagnostics as a
      # GitHub Actions artifact (downloaded by GitHub as a ZIP archive).
      - name: Upload build reports ZIP
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: activity-tracker-build-reports
          path: |
            activity-tracker-build-reports.zip
            ci-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Mark workflow failed when verification failed
        if: always()
        shell: bash
        run: |
          failed=0
          for f in ci-reports/*.exitcode; do
            if [ -f "$f" ] && [ "$(cat "$f")" != "0" ]; then
              echo "FAILED: $f -> $(cat "$f")"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more verification stages failed. Reports have already been uploaded."
            exit 1
          fi
          echo "All verification stages passed."
